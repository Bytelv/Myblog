  };

  function currentMode() {
    var t = document.documentElement.getAttribute('data-theme');
    return t === 'light' || t === 'dark' ? t : 'auto';
  }

  function sync() {
    // 用属性前缀选择器定位按钮，与 source/css/custom.css 第 5 节的挂钩点保持一致。
    // （主题的 footer action 校验是 sealed 的，没法给它加自定义 data-* 属性。）
    var btn = document.querySelector('button[onclick^="window.setColorScheme"]');
    if (!btn) return;
    var mode = currentMode();
    var label = NEXT_LABEL[mode];
    btn.setAttribute('title', label);

  }

  document.addEventListener('stellar:color-scheme-change', sync);
  // 页面内切换（含局部导航）后补一次，防止事件绑定时按钮尚未渲染
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', sync);
  } else {
    sync();
  }
})();

(function() {
  // 使用 PerformanceObserver 监听 Core Web Vitals
  function sendToAnalytics(metric) {
    // 发送到分析端点 (可以替换为自建服务或 Google Analytics)
    const body = JSON.stringify(metric);
    console.log('[Web Vitals]', metric.name, ':', metric.value);

    // 可选: 发送到自建统计接口
    // navigator.sendBeacon('https://analytics.lvbyte.top/vitals', body);

    // 可选: 保存到 localStorage 用于调试
    try {
      var stored = JSON.parse(localStorage.getItem('webVitals') || '{}');
      stored[metric.name] = { value: metric.value, rating: metric.rating };
      localStorage.setItem('webVitals', JSON.stringify(stored));
    } catch(e) {}
  }

  try {
    // LCP (最大内容绘制)
    var lcpObserver = new PerformanceObserver(function(list) {
      var entries = list.getEntries();
      var lastEntry = entries[entries.length - 1];
      if (lastEntry) {
        sendToAnalytics({
          name: 'LCP',
          value: lastEntry.startTime,
          rating: lastEntry.startTime <= 2500 ? 'good' : lastEntry.startTime <= 4000 ? 'needs-improvement' : 'poor'
        });
      }
      lcpObserver.disconnect();
    });
    lcpObserver.observe({ type: 'largest-contentful-paint', buffered: true });

    // FID / INP (首次输入延迟 / 交互到下一次绘制)
    var inpObserver = new PerformanceObserver(function(list) {
      var entries = list.getEntries();
      entries.forEach(function(entry) {
        sendToAnalytics({
          name: 'INP',
          value: entry.duration,
          rating: entry.duration <= 200 ? 'good' : entry.duration <= 500 ? 'needs-improvement' : 'poor'
        });
      });
    });
    inpObserver.observe({ type: 'first-input', buffered: true });
    inpObserver.observe({ type: 'event', durationThreshold: 0, buffered: true });

    // CLS (累计布局偏移)
    var clsValue = 0;
    var clsObserver = new PerformanceObserver(function(list) {
      list.getEntries().forEach(function(entry) {
        if (!entry.hadRecentInput) {
          clsValue += entry.value;
        }
      });
    });
    clsObserver.observe({ type: 'layout-shift', buffered: true });

    // 页面卸载前上报 CLS
    window.addEventListener('beforeunload', function() {
      sendToAnalytics({
        name: 'CLS',
        value: clsValue,
        rating: clsValue <= 0.1 ? 'good' : clsValue <= 0.25 ? 'needs-improvement' : 'poor'
      });
    });
  } catch(e) {
    // PerformanceObserver not supported
  }
})();
